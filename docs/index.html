<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><link rel="icon" href="./icons/scaros.svg" type="image/svg+xml"><title>ScarOS — Desktop design preview</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="discovery.css"><link rel="stylesheet" href="essentials.css"><link rel="stylesheet" href="desktop-polish.css"><script src="wallpapers.js" defer></script><script src="motion.js" defer></script><script src="icon-pack.js" defer></script><script src="app.js" defer></script><script src="shortcuts.js" defer></script><script src="essentials.js" defer></script></head>
<body>
<main id="desktop" aria-label="ScarOS interactive desktop preview">
  <div id="wallpaper" aria-hidden="true"><img id="wallpaper-image" alt=""></div>
  <header id="menubar" class="glass" aria-label="Menu bar"><nav id="menu-left" aria-label="Desktop tools"></nav><div id="menu-right"></div></header>
  <div id="desktop-items"><button class="desktop-item" data-open="files" data-folder="Documents"><img src="./icons/files.svg" alt=""><span>Documents</span></button><button class="desktop-item" data-open="installer"><img src="./icons/installer.svg" alt=""><span>Install ScarOS</span></button></div>
  <section id="windows" aria-label="Application windows"></section>
  <div id="dock-zone"><nav id="dock" class="glass" aria-label="Dock"></nav></div>
  <button id="preview-toggle" title="Preview guide and design controls">Design preview <span class="keycap">?</span></button>
  <div id="popup-root"></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div>
</main>
</body></html>
